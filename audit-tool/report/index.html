<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard Service</title>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loadingOverlay" class="loading-overlay" aria-live="polite" aria-busy="true">
    <div class="loading-mark" aria-label="Đang tải dữ liệu">
      <svg class="loading-orbit" viewBox="0 0 160 160" role="img" aria-hidden="true">
        <defs>
          <path id="loadingOrbitPath" d="M 80,80 m -58,0 a 58,58 0 1,1 116,0 a 58,58 0 1,1 -116,0" />
        </defs>
        <text>
          <textPath href="#loadingOrbitPath" startOffset="0%">Histaff System - Professional HRM Solution</textPath>
        </text>
      </svg>
      <div class="loading-arrow">&#8594;</div>
    </div>
  </div>
  <main class="dashboard-canvas">
    <div class="tab-nav" id="tabNav" role="tablist" aria-label="Dashboard tabs"></div>
    <div class="filter-bar" id="filterBar">
      <div id="orgFilterGroup" class="filter-group">
        <label for="filterOrg">Đơn vị</label>
        <select id="filterOrg"><option value="">Tất cả</option></select>
      </div>
      <div class="filter-group">
        <label for="filterYear">Năm</label>
        <select id="filterYear"><option value="">Tất cả</option></select>
      </div>
      <div class="filter-group">
        <label for="filterMonth">Tháng</label>
        <select id="filterMonth"><option value="">Tất cả</option></select>
      </div>
      <button id="btnApply" class="btn-apply" type="button">Áp dụng</button>
      <span id="filterStatus" class="filter-status"></span>
    </div>
    <div id="banner" class="status-banner">Đang tải data.json...</div>
    <div id="panels"></div>
  </main>

  <script src="echarts.min.js"></script>
  <script src="charts-meta.js"></script>
  <script src="app.js"></script>
</body>
</html>
